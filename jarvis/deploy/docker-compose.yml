services:
  jarvis:
    build: ../backend
    restart: unless-stopped
    env_file: ../backend/.env
    environment:
      DB_PATH: /srv/data/jarvis.db
    volumes:
      - jarvis-data:/srv/data
    expose: ["8000"]
  caddy:   # automatic HTTPS (Let's Encrypt) + WebSocket proxying
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
volumes:
  jarvis-data:
  caddy-data:
